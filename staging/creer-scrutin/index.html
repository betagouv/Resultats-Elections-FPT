<html>
  <head>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.0/dist/dsfr.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/app.css" />
  </head>
  <body>
    <main id="view" class="fr-container app-cw-search fr-p-3w">
      <h2 id="modal-title" class="fr-modal__title">
        Créer un scrutin <span id="scrutin-name"></span>
      </h2>
      <section id="form">
        <p>Quelle est la collectivité organisatrice du scrutin ?</p>
        <div class="fr-search-bar fr-search-bar--lg" role="search">
          <label class="fr-label" for="search-input">
            Rechercher par son nom
          </label>
          <input
            class="fr-input"
            aria-describedby="search-input-messages"
            placeholder="Rechercher une collectivité par son nom"
            id="search-add-input"
            type="search"
          />
          <button
            id="search-add-button"
            title="Rechercher"
            type="button"
            class="fr-btn"
          >
            Rechercher
          </button>
        </div>
        <div class="fr-mt-1w">
          <p id="search-add-loading" class="fr-hidden">
            Recherche en cours
          </p>
          <p id="search-add-empty" class="fr-hidden">
            Aucune collectivité trouvée
          </p>
          <form id="search-add-results"></form>
        </div>
        <button
          class="fr-btn fr-hidden"
          type="button"
          id="search-create-button"
          style="position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 3;"
        >
          Créer un scrutin
        </button>
      </section>

      <section id="message" class="fr-hidden">
        <div class="fr-alert fr-alert--success fr-mb-3w" id="success">
          <h3 class="fr-alert__title">
            Scrutin <span id="success-scrutin-name"></span> créé pour la
            collectivité <span id="success-collectivite-name"></span>
          </h3>
          <p>
            Retrouver le scrutin dans la page « 🗳️ Scrutins
            <span id="success-scrutin-page"></span> »
          </p>
        </div>
        <div class="fr-grid-row fr-grid-row--center">
          <button class="fr-btn fr-btn--secondary" id="backToForm">
            Créer un nouveau scrutin
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="main.js?mep=26.08.13"></script>
  </body>
</html>
